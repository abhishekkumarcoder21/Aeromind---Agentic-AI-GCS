# AeroMind — Docker Compose
# Start everything: docker compose up --build

services:
  # ── PostgreSQL ──
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: aeromind
      POSTGRES_USER: aeromind
      POSTGRES_PASSWORD: aeromind
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aeromind"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ── Redis ──
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ── Backend (FastAPI + Simulator) ──
  backend:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.backend
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://aeromind:aeromind@postgres:5432/aeromind
      DATABASE_URL_SYNC: postgresql://aeromind:aeromind@postgres:5432/aeromind
      REDIS_URL: redis://redis:6379/0
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-gpt-4o}
      LLM_BASE_URL: ${LLM_BASE_URL:-https://api.openai.com/v1}
      TELEMETRY_INTERVAL_MS: ${TELEMETRY_INTERVAL_MS:-1000}
      INITIAL_UAV_COUNT: ${INITIAL_UAV_COUNT:-8}
      MIN_BATTERY_PERCENT: ${MIN_BATTERY_PERCENT:-25}
      MIN_SEPARATION_METERS: ${MIN_SEPARATION_METERS:-50}
      GEOFENCE_ENABLED: ${GEOFENCE_ENABLED:-true}
      CORS_ORIGINS: "http://localhost:3000,http://frontend:3000"
      LOG_LEVEL: INFO
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - .:/app
    restart: unless-stopped

  # ── Frontend (Next.js) ──
  frontend:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.frontend
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
      NEXT_PUBLIC_WS_URL: ws://localhost:8000
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  pgdata:
